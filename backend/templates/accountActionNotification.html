<div class="greeting">Hello {{recipientName}},</div>

<span class="badge {{badgeClass}}">{{actionTitle}}</span>

<p style="font-size: 15px; line-height: 1.6; color: #334155;">
  {{actionMessage}}
</p>

<table class="details-table">
  <tr>
    <th>Account Status</th>
    <td>{{accountStatus}}</td>
  </tr>
  <tr>
    <th>Effective Date</th>
    <td>{{effectiveDate}}</td>
  </tr>
  <tr>
    <th>Official Reason</th>
    <td style="color: #ef4444; font-weight: 600;">{{reason}}</td>
  </tr>
</table>

<div class="{{alertBoxClass}}">
  {{actionGuidance}}
</div>

<p style="font-size: 13px; color: #64748b; margin-top: 24px;">
  If you believe this action was made in error, contact AgriRent administrative operations.
</p>
