<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      background-color: #f1f5f9;
      padding: 40px 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    .header {
      background: linear-gradient(135deg, #15803d 0%, #16a34a 100%);
      padding: 28px 32px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      color: #ffffff;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .header p {
      margin: 6px 0 0 0;
      color: #bbf7d0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .content {
      padding: 32px;
    }
    .greeting {
      font-size: 16px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 16px;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }
    .badge-success { background-color: #dcfce7; color: #15803d; }
    .badge-warning { background-color: #fef3c7; color: #b45309; }
    .badge-danger { background-color: #fee2e2; color: #b91c1c; }
    .badge-info { background-color: #e0f2fe; color: #0369a1; }
    .otp-card {
      background-color: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      padding: 24px;
      text-align: center;
      margin: 24px 0;
    }
    .otp-code {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #16a34a;
      font-family: 'Courier New', Courier, monospace;
      margin: 8px 0;
    }
    .details-table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    .details-table th, .details-table td {
      padding: 10px 14px;
      text-align: left;
      font-size: 14px;
      border-bottom: 1px solid #f1f5f9;
    }
    .details-table th {
      color: #64748b;
      font-weight: 500;
      width: 40%;
    }
    .details-table td {
      color: #0f172a;
      font-weight: 600;
    }
    .info-box {
      background-color: #f0fdf4;
      border-left: 4px solid #16a34a;
      padding: 14px 18px;
      border-radius: 4px;
      margin: 20px 0;
      font-size: 14px;
      color: #166534;
      line-height: 1.5;
    }
    .alert-box {
      background-color: #fef2f2;
      border-left: 4px solid #ef4444;
      padding: 14px 18px;
      border-radius: 4px;
      margin: 20px 0;
      font-size: 14px;
      color: #991b1b;
      line-height: 1.5;
    }
    .warning-box {
      background-color: #fffbeb;
      border-left: 4px solid #f59e0b;
      padding: 14px 18px;
      border-radius: 4px;
      margin: 20px 0;
      font-size: 14px;
      color: #92400e;
      line-height: 1.5;
    }
    .footer {
      background-color: #f8fafc;
      padding: 24px 32px;
      text-align: center;
      border-top: 1px solid #e2e8f0;
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }
    .footer a {
      color: #16a34a;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <h1>AgriRent</h1>
        <p>Smart Equipment Rental Platform</p>
      </div>
      <div class="content">
        {{{bodyContent}}}
      </div>
      <div class="footer">
        <p>This is an automated notification from AgriRent. Please do not reply directly to this email.</p>
        <p>&copy; 2026 AgriRent. Secure Agricultural Equipment Sharing System.</p>
      </div>
    </div>
  </div>
</body>
</html>
